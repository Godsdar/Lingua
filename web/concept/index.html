<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Lingua's reading concept: selected expressions, grammar, word families, and study notes. Live English grammar on request, with offline prepared examples.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">

  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./concept.css">

<body>
  <main class="lp-demo-shell">
    <nav class="lp-demo-nav" aria-label="Demo navigation">
      <a href="../">← Dictionary app</a>

  </div>
</div>
  </main>
  <script type="module" src="./concept.js"></script>
